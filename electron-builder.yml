appId: com.datafuturex.note
productName: DataFutureX Note
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
# 打包后把 Logo 写入 exe，桌面快捷方式才能显示 Logo
afterPack: scripts/after-pack.mjs
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.ico
  - resources/icon.png
  - resources/tray-16.png
  - resources/tray-32.png
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray-16.png
    to: tray-16.png
  - from: resources/tray-32.png
    to: tray-32.png
extraFiles:
  - from: resources/icon.ico
    to: icon.ico
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown Document
    mimeType: text/markdown
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown Document
    mimeType: text/markdown
    role: Editor

win:
  # 只产出 win-unpacked；单文件 Setup 由 scripts/wrap-installer.mjs 生成（不使用 NSIS）
  target:
    - target: dir
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false

compression: normal
