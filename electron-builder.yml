appId: com.datafuturex.note
productName: DataFutureX Note
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
# 打包后把 Logo 写入 exe，桌面快捷方式才能显示 Logo
afterPack: scripts/after-pack.mjs
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.ico
  - resources/icon.png
  - resources/tray-16.png
  - resources/tray-32.png
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray-16.png
    to: tray-16.png
  - from: resources/tray-32.png
    to: tray-32.png
# 安装目录根下也放一份 Logo，供桌面快捷方式稳定引用
extraFiles:
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  # Logo 图标（与 logo-mark / npm run icon 同源）
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  # 关闭自动 rcedit/签名，改由 afterPack 单独写入 Logo，避免 winCodeSign 缓存问题
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 由 build/installer.nsh 统一创建（显式引用 Logo icon.ico）
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: 数字未来笔记
  uninstallDisplayName: DataFutureX Note（数字未来笔记）
  deleteAppDataOnUninstall: false
  include: installer.nsh
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
